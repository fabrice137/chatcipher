<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat Cipher</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              surface: {
                50: "#f0f1f5",
                100: "#e1e3eb",
                200: "#c3c7d7",
                700: "#2d2f3e",
                800: "#1f2133",
                900: "#13141f",
              },
              accent: "#a78bfa",
              "accent-hover": "#c4b5fd",
              success: "#34d399",
              danger: "#f87171",
            },
          },
        },
      };
    </script>
    <script src="script.js" defer></script>
  </head>

  <body
    class="min-h-screen bg-gradient-to-br from-surface-900 via-surface-800 to-surface-900 flex items-center justify-center p-4 font-sans text-surface-50 antialiased"
  >
    <main
      class="w-full max-w-lg bg-surface-800/80 backdrop-blur-lg border border-surface-700/60 rounded-2xl shadow-2xl shadow-black/30 overflow-hidden"
    >
      <!-- Header -->
      <div
        class="px-8 pt-8 pb-4 text-center border-b border-surface-700/40"
      >
        <div class="inline-flex items-center gap-2 mb-1">
          <svg
            class="size-7 text-accent"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="1.5"
              d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z"
            />
          </svg>
          <h1 class="text-2xl font-bold tracking-tight text-white">
            Chat Cipher
          </h1>
        </div>
        <p class="text-sm text-surface-200">
          Caesar-shift encryption with hex encoding
        </p>
      </div>

      <div class="px-8 py-6 space-y-5">
        <!-- Plain text -->
        <div class="relative">
          <label
            for="plaintext"
            class="block text-xs font-semibold uppercase tracking-wider text-accent mb-1.5"
            >Plain text</label
          >
          <textarea
            id="plaintext"
            rows="3"
            placeholder="Type your message…"
            class="w-full rounded-lg bg-surface-700/60 border border-surface-700 px-4 py-3 text-sm text-surface-50 placeholder-surface-200/50 focus:outline-none focus:ring-2 focus:ring-accent/60 transition resize-none"
          ></textarea>
          <button
            data-copy
            onclick="copyToClipboard('plaintext')"
            title="Copy"
            class="absolute top-8 right-2 p-1.5 rounded-md text-surface-200 hover:text-white hover:bg-surface-700 transition"
          >
            <svg class="size-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"
              />
            </svg>
          </button>
        </div>

        <!-- Shift / Spice code -->
        <div>
          <label
            for="shift"
            class="block text-xs font-semibold uppercase tracking-wider text-accent mb-1.5"
            >Shift key&ensp;<span class="text-surface-200 font-normal normal-case">(1 – 25)</span></label
          >
          <input
            type="number"
            id="shift"
            min="1"
            max="25"
            value="1"
            class="w-full rounded-lg bg-surface-700/60 border border-surface-700 px-4 py-2.5 text-sm text-surface-50 focus:outline-none focus:ring-2 focus:ring-accent/60 transition"
          />
          <p
            id="error"
            class="hidden mt-1.5 text-xs text-danger font-medium"
          >
            Please enter a valid number between 1 and 25.
          </p>
        </div>

        <!-- Action buttons -->
        <div class="flex items-center gap-3">
          <button
            onclick="encrypt()"
            class="flex-1 flex items-center justify-center gap-2 rounded-lg bg-accent/90 hover:bg-accent text-white font-semibold py-2.5 transition active:scale-[.97]"
          >
            <svg class="size-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
            </svg>
            Encrypt
          </button>

          <button
            onclick="swapFields()"
            title="Swap"
            class="p-2.5 rounded-lg bg-surface-700/60 border border-surface-700 text-surface-200 hover:text-white hover:border-accent/50 transition active:scale-[.95]"
          >
            <svg class="size-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4"/>
            </svg>
          </button>

          <button
            onclick="decrypt()"
            class="flex-1 flex items-center justify-center gap-2 rounded-lg bg-accent/90 hover:bg-accent text-white font-semibold py-2.5 transition active:scale-[.97]"
          >
            <svg class="size-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 11V7a4 4 0 118 0m-4 8v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2z"/>
            </svg>
            Decrypt
          </button>
        </div>

        <!-- Cipher text -->
        <div class="relative">
          <label
            for="ciphertext"
            class="block text-xs font-semibold uppercase tracking-wider text-accent mb-1.5"
            >Cipher text</label
          >
          <textarea
            id="ciphertext"
            rows="4"
            placeholder="Encrypted output appears here…"
            class="w-full rounded-lg bg-surface-700/60 border border-surface-700 px-4 py-3 text-sm text-surface-50 font-mono placeholder-surface-200/50 focus:outline-none focus:ring-2 focus:ring-accent/60 transition resize-none"
          ></textarea>
          <button
            data-copy
            onclick="copyToClipboard('ciphertext')"
            title="Copy"
            class="absolute top-8 right-2 p-1.5 rounded-md text-surface-200 hover:text-white hover:bg-surface-700 transition"
          >
            <svg class="size-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"
              />
            </svg>
          </button>
        </div>
      </div>

      <!-- Footer -->
      <div
        class="px-8 py-4 border-t border-surface-700/40 flex items-center justify-between"
      >
        <span class="text-xs text-surface-200/60">No data leaves your browser</span>
        <button
          onclick="clearAll()"
          class="text-xs font-medium text-surface-200 hover:text-danger transition"
        >
          Clear all
        </button>
      </div>
    </main>
  </body>
</html>
